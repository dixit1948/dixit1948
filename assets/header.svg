
<svg width="1000" height="340" viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/><stop offset="0.5" stop-color="#0b1226"/><stop offset="1" stop-color="#150a2b"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#00f5ff"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#ff2bd6"/>
      <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f5ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .name{font:800 76px 'Segoe UI',Arial,sans-serif;letter-spacing:2px}
      .sub{font:600 22px 'Consolas','Courier New',monospace;fill:#c9d1d9;text-anchor:middle}
      .s1{animation:s 9s infinite} .s2{animation:s 9s 3s infinite;opacity:0} .s3{animation:s 9s 6s infinite;opacity:0}
      @keyframes s{0%{opacity:0;transform:translateY(8px)}6%,30%{opacity:1;transform:translateY(0)}36%,100%{opacity:0;transform:translateY(-8px)}}
      .tag{font:700 13px 'Consolas',monospace;fill:#00ffa3}
      .pulse{animation:p 1.6s infinite} @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
    </style>
  </defs>
  <rect width="1000" height="340" fill="url(#bg)"/>
  <rect width="1000" height="340" fill="url(#grid)"/>
  <g filter="url(#blur)">
    <circle r="90" fill="#00f5ff" opacity="0.35"><animate attributeName="cx" values="120;380;120" dur="11s" repeatCount="indefinite"/><animate attributeName="cy" values="80;240;80" dur="9s" repeatCount="indefinite"/></circle>
    <circle r="110" fill="#a855f7" opacity="0.38"><animate attributeName="cx" values="520;760;520" dur="13s" repeatCount="indefinite"/><animate attributeName="cy" values="260;60;260" dur="10s" repeatCount="indefinite"/></circle>
    <circle r="80" fill="#ff2bd6" opacity="0.3"><animate attributeName="cx" values="880;640;880" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="90;250;90" dur="8s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#fff">
    <circle cx="90" cy="60" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="290" r="1.4"><animate attributeName="opacity" values="1;0.1;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="40" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="300" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="48" r="1.7"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="200" r="1.3"><animate attributeName="opacity" values="1;0.1;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="190" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>
  <text x="500" y="52" text-anchor="middle" class="tag"><tspan class="pulse">●</tspan> OPEN TO WORK  ·  SURAT, INDIA</text>
  <text x="500" y="160" text-anchor="middle" class="name" fill="url(#txt)" filter="url(#glow)">DIXIT PEDHADIYA</text>
  <text x="500" y="222" class="sub s1">&lt; Full Stack Developer /&gt;</text>
  <text x="500" y="222" class="sub s2">&lt; AI Automation Engineer /&gt;</text>
  <text x="500" y="222" class="sub s3">&lt; Computer Engineer · Laravel · React · n8n /&gt;</text>
  <rect x="300" y="262" width="400" height="3" rx="2" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="300" y="262" width="110" height="3" rx="2" fill="url(#txt)">
    <animate attributeName="x" values="300;590;300" dur="3.6s" repeatCount="indefinite"/>
  </rect>
</svg>
